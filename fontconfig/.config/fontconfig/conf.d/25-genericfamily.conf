<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- fontconfig >= 2.18: fonts whose genericfamily is unset (0) lose
       matching against any font that has one. These fonts were not
       recognized by the built-in guesser.
       cf. https://fedoraproject.org/wiki/Changes/Fontconfig2.18 -->

  <!-- Sans -->
  <match target="scan">
    <test name="family"><string>LXGW Neo XiHei Plus</string></test>
    <edit name="genericfamily" mode="assign_replace"><const>sans-serif</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>KoPubDotum</string></test>
    <edit name="genericfamily" mode="assign_replace"><const>sans-serif</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>IPAexGothic</string></test>
    <edit name="genericfamily" mode="assign_replace"><const>sans-serif</const></edit>
  </match>

  <!-- Serif -->
  <match target="scan">
    <test name="family"><string>AR PL UMing CN</string></test>
    <edit name="genericfamily" mode="assign_replace"><const>serif</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>AR PL UMing HK</string></test>
    <edit name="genericfamily" mode="assign_replace"><const>serif</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>AR PL UMing TW</string></test>
    <edit name="genericfamily" mode="assign_replace"><const>serif</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>AR PL UMing TW MBE</string></test>
    <edit name="genericfamily" mode="assign_replace"><const>serif</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>KoPubBatang</string></test>
    <edit name="genericfamily" mode="assign_replace"><const>serif</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>IPAexMincho</string></test>
    <edit name="genericfamily" mode="assign_replace"><const>serif</const></edit>
  </match>

  <!-- Uncommon CJK character coverage. -->
  <match target="scan">
    <test name="family"><string>Plangothic P1</string></test>
    <edit name="genericfamily" mode="assign_replace"><const>sans-serif</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Plangothic P2</string></test>
    <edit name="genericfamily" mode="assign_replace"><const>sans-serif</const></edit>
  </match>
</fontconfig>
